# omp-config unified extension configuration (omomp).
# One top-level section per extension; the section id is the extension's directory name.
# Installed as <agent dir>/omomp.yml. Machine-local sections (doc-polish, model-compaction,
# omp-config-autoupdate) live only on the machine and are never written from here.
omomp-lang:
  language: zh
judge:
  fallbackRole: tiny
lang-nag:
  language: 中文
  instruction: 说中文
input-polish:
  key: ctrl+enter
  instruction: 在不改变原意的前提下，改写到听起来会让人更加想努力、能激动人心，但不要太夸张。
  fallbackRole: smol
tool-policy-nag:
  detector: heuristic
  form:
    prompt: 你为什么不遵守system prompt，反思自己以后继续。
    afterHits: 3
    maxNags: 3
  intent:
    threshold: 0.5
  risk:
    minCommands: 4
    minChars: 600
    minPrograms: 3
task-completion-judge:
  fallbackRole: smol
task-split-check:
  fallbackRole: smol
child-memory-warning:
  thresholdGiB: 4
tool-topic-injection:
  rules:
    - id: read-ssh
      tool: read
      parameter: path
      pattern: '^ssh://'
      topic: tool://read/ssh
    - id: eval-ssh-cat
      tool: eval
      parameter: code
      pattern: '\bssh\b[^\n;|&]*\bcat\b'
      topic: tool://read/ssh
    - id: bash-ssh-cat
      tool: bash
      parameter: command
      pattern: '\bssh\b[^\n;|&]*\bcat\b'
      topic: tool://read/ssh
    - id: read-archives
      tool: read
      parameter: path
      pattern: '\.(zip|jar|war|whl|apk|vsix|nupkg|tar|tgz|tbz2?|txz|tzst|gz|bz2|xz|zst|7z|rar|deb|rpm|iso|asar)(:|$)'
      topic: tool://read/archives
    - id: read-sqlite
      tool: read
      parameter: path
      pattern: '\.(sqlite3?|db3?)(:|\?|$)'
      topic: tool://read/sqlite
    - id: read-json
      tool: read
      parameter: path
      pattern: '\.(json|jsonl|ndjson)(\?|:|$)'
      topic: tool://read/json
    - id: read-documents
      tool: read
      parameter: path
      pattern: '\.(pdf|docx|pptx|xlsx|epub|ipynb)(:|\?|$)'
      topic: tool://read/documents
    - id: read-forge
      tool: read
      parameter: path
      pattern: '^(issue|pr|mr)://'
      topic: tool://read/forge
    - id: read-runtime
      tool: read
      parameter: path
      pattern: '^(agent|history|proc|artifact)://'
      topic: tool://read/runtime
    - id: read-web
      tool: read
      parameter: path
      pattern: '^(https?://|www\.)'
      topic: tool://read/web
    - id: grep-regex
      tool: grep
      parameter: pattern
      pattern: '\(\?[=!<]|\\[1-9]|\\n|\n'
      topic: tool://grep/regex
    - id: grep-scopes
      tool: grep
      parameter: path
      pattern: '(^|;)!|://|\.(zip|jar|whl|tar|tgz|gz|zst):'
      topic: tool://grep/scopes
    - id: glob-patterns
      tool: glob
      parameter: path
      pattern: '://|/$'
      topic: tool://glob/patterns
    - id: web-search-query
      tool: web_search
      parameter: query
      pattern: '(^|\s)-?(site|domain|host|after|before|since|until|intitle|title|inurl|url|filetype|ext|lang|from):'
      topic: tool://web_search/query
system-prompt-replace:
  replacements:
    - regex: "No TODO tracking, no progress updates\\."
      replace: ""
      scope: sub
    - literal: "User-reported errors, failures, observations are ground truth; NEVER rerun checks to confirm them."
      replace: "User-reported errors, failures, observations are ground truth; NEVER rerun checks to doubt them. Reproducing to locate the cause and confirming the fix still apply."
    - literal: "Compiled code: NEVER avoidable allocation, copying, computation."
      replace: "Compiled code: NEVER add avoidable allocation, copying, computation."
    - literal: "On error, retry only the failed step; earlier steps may have taken effect."
      replace: "On error, retry only the failed step; earlier steps may have taken effect.\n// Refuse to investigate files through `eval`: reading content (`open`, `Path.read_text`, `Bun.file`, `readFileSync`, the prelude `read()`), listing or finding files (`os.listdir`, `os.walk`, `glob.glob`, `readdirSync`), and searching text (regex over file content, `subprocess` running `cat`/`ls`/`find`/`grep`/`rg`) belong to `read`, `glob` and `grep`. A quick look, many files at once, or fewer tool calls are not exceptions. `eval` starts only where the work needs language semantics on data already in hand: computation, transforms, structured parsing, library calls."
    - regex: "Write JSON args as `content` to `xd://<tool>` via `([^`]+)`\\."
      replace: "Write JSON args as `content` to `xd://<tool>` via `$1`. Devices are not functions: no `xd__<tool>`, `xd_<tool>`, or bare `<tool>` function exists, so never call one; the only call is `$1` with `path` set to `xd://<tool>`."
