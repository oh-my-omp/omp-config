    - scout
    - sonic
    - reviewer
    - security-reviewer
  agentModelOverrides:
    discuss:divergent: "anthropic/claude-opus-5-5:medium, openai-codex/gpt-5.6-luna:max"
    discuss:steady: openai-codex/gpt-5.6-sol:medium
    mentor:default: "openai-codex/gpt-5.6-sol:high, openai-codex/gpt-5.6-luna:max"
    task:high: anthropic/claude-opus-5-5:high
    task:mid: openai-codex/gpt-6-1-sol:high
    task:low: openai-codex/gpt-5.6-luna:max
    task:free: "bansos/muse-spark-1.3-contributor:xhigh, opencode-go/muse-spark-1.3-contributor:xhigh, openai-codex/gpt-6-luna:max"
    sonic: openai-codex/gpt-6-luna:max
    task: openai-codex/gpt-6-luna:max
  agentPrewalk:
    {}
  isolation:
    enabled: true
    merge: branch
  enableLsp: false
  enableEffort: false
  maxConcurrency: 64
  maxEffort: high
fetch:
  enabled: true
browser:
  enabled: false
  headless: false
  cmux: false
launch:
  enabled: false
bashInterceptor:
  enabled: true
  # OMP's defaults minus `cat <<` heredocs piped into a program and `tail -f`
  # (both stay shell), and minus the three rules that send services, watchers and
  # `nohup`/`&` to `bash` with `name`: `launch.enabled` is false, so that mode
  # does not exist here; such work belongs to `exec_command`.
  patterns:
    - pattern: |-
        ^\s*(?:cat\s+(?!<<)|(?:head|less|more)\s+|tail\s+(?!(?:.*\s)?-[a-zA-Z]*[fF](?:\s|$)))
      tool: read
      message: Use the `read` tool instead of cat/head/tail/less/more. It provides better context and handles binary files.
    - pattern: |-
        ^\s*(grep|rg|ripgrep|ag|ack)\s+
      tool: grep
      message: Use the `grep` tool instead of grep/rg. It respects .gitignore and provides structured output.
    - pattern: |-
        ^\s*(find|fd|locate)\s+.*(-name|-iname|-type|--type|-glob)
      tool: glob
      message: Use the `glob` tool instead of find/fd. It respects .gitignore and is faster for glob patterns.
    - pattern: |-
        ^\s*sed\s+(-i|--in-place)
      tool: edit
      message: Use the `edit` tool instead of sed -i. It provides diff preview and fuzzy matching.
    - pattern: |-
        ^\s*perl\s+.*-[pn]?i
      tool: edit
      message: Use the `edit` tool instead of perl -i. It provides diff preview and fuzzy matching.
    - pattern: |-
        ^\s*awk\s+.*-i\s+inplace
      tool: edit
      message: Use the `edit` tool instead of awk -i inplace. It provides diff preview and fuzzy matching.
    - pattern: |-
        ^\s*(echo|printf|cat\s*<<)\s+(?:(?:[^"'>]|"[^"]*"|'[^']*')|(?<!\|)>{1,2}\|?\s*(?:"/dev/(?:null|tty|stdout|stderr)"|'/dev/(?:null|tty|stdout|stderr)'|/dev/(?:null|tty|stdout|stderr))(?:[\s;&|]|$))*(?<!\|)>{1,2}\|?\s*(?!(?:"/dev/(?:null|tty|stdout|stderr)"|'/dev/(?:null|tty|stdout|stderr)'|/dev/(?:null|tty|stdout|stderr))(?:[\s;&|]|$))[$\w./~"'-]
      tool: write
      message: Use the `write` tool instead of echo/cat redirection. It handles encoding and provides confirmation.
cycleOrder:
  - slow
extendedContext: true
compaction:
  methodOrder:
    - remote
    - soft
    - snapcompact
    - handoff
    - shake
