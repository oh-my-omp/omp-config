# Configuration check. `code`: Biome and tsc over the extensions, the updater
# and ci/ (`bun run check`), then the unit tests in ci/ (`bun run test`).
# `omp-session`: install the latest omp, apply this
# repo with its own updater, run one real session per mode on a free model,
# and report every fault or warning. Design and criteria: ci/README.md.
name: config-check

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: config-check-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code:
    name: format, lint, type check and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest
      - name: Install dev dependencies
        run: bun install
      - name: Check
        run: bun run check
      - name: Test
        run: bun run test

  omp-session:
    name: omp session with the repo config
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest
      - name: Check
        run: bun ci/check.ts
